# DarkForestGrid v2.0 — resource economy + invasion + tech-gated action pool
# Redesign co-designed with the user (2026-09-07), 8 points; see env2.py docstring.
# v1.x ladder data preserved in runs_v10_pilot/ runs_v11/ runs_v12_rerun/ runs_v13/ runs/ runs_v14_ter/.

env:
  n_agents: 12
  world: 100.0
  detect_radius: 30.0
  t_max: 250
  p_detect_base: 0.03
  stealth_mult: 0.25
  p_detect_max: 0.35
  p_explosion: 0.01
  develop_rate: 0.05
  tech_cap: 10.0
  tech_spawn_lo: 0.5
  tech_spawn_hi: 10.0
  kill_base: 0.55
  kill_tech_slope: 0.12
  res_min: 5.0
  res_max: 20.0
  p_deplete: 0.02
  deplete_lo: 0.5
  deplete_hi: 2.0
  gate_broadcast_tech: 1.0
  gate_broadcast_res: 10.0
  gate_observe_tech: 5.0
  gate_domain_tech: 5.0
  gate_strike_tech: 7.0
  develop_reward: 0.05
  death_penalty: 10.0
  bd_entry_penalty: 0.5
  bd_growth_mult: 0.2
  bd_explosion_mult: 0.1
  enable_black_domain: true

model:
  obs_dim: 36
  n_actions: 8
  hidden: [64, 64]

train:
  episodes: 500
  gamma: 0.995
  lr: 0.0006
  batch_size: 128
  replay_size: 150000
  update_every: 2
  target_sync: 2000
  eps_start: 1.0
  eps_end: 0.10
  eps_frac: 0.55
  seeds: [42, 43, 44]

eval:
  episodes: 400
  epsilon: 0.05
  policy_seeds: [1001, 1002, 1003]
  env_seed_base: 10001

ablations:
  no_black_domain:
    enable_black_domain: false
