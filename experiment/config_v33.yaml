# DarkForestGrid v2.5 — information completeness + uncapped births
# On top of v2.4 (BROADCAST_ALL rename / BROADCAST_OTHER reveal / no tech-ranked
# strikes / OBSERVE explicit target / no tech inheritance / 4 reward arms).
# v2.5 changes (user spec 2026-10-15):
#   1) Birth-count cap removed: slot count stays 36, but when no unborn slot
#      remains a DEAD slot is recycled for the newborn (social state wiped —
#      the newborn starts blank). Civilizations ever born: uncapped; the
#      conservation budget is the only brake; end condition unchanged.
#      obs normalizers use n_norm=36 to keep signal scale comparable with v2.4.
#   2) "Being invaded" is a first-class env state: victim instantly discovers
#      the invader (known) AND knows it is under attack (obs under_attack flag,
#      sliding one-tick window, visible in the re-choose obs). No dedicated
#      counter-invasion actions — the policy reacts with normal moves.
#   3) "I am being broadcast (BROADCAST_OTHER)" is prominently discoverable:
#      persistent self_public flag in obs (public is permanent by design).
#   obs: scal 7 -> 9 (under_attack, self_public), OBS_DIM 38.
#   5) Reward arms (per-arm overrides on top of this file, carried over from
#      v2.4 — the four-arm comparison re-runs under the new information regime):
#      (a) classic       : as-is (softsign 0.01, bd_entry 0.5)
#      (b) terminal_only : softsign_reward_scale 0, bd_entry_penalty 0
#      (c) res_reward    : + res_reward_scale 0.0025 (0.0125..0.05/tick on
#                          DEVELOP — same order as the tech term, << death 10)
#      (d) malintent     : (c) + attack_reward 0.5 per strike-kill / invasion-
#                          kill / BROADCAST_OTHER reveal (= bd entry penalty;
#                          success-based: no reward for blocked strikes or
#                          self-exposing BROADCAST_ALL)

env:
  n_agents: 36          # v2.5: slot count (unchanged); birth COUNT uncapped via dead-slot recycling
  world: 100.0
  detect_radius: 30.0
  t_max: 250
  p_detect_base: 0.03
  stealth_mult: 0.25
  p_detect_max: 0.35
  p_explosion: 0.01
  develop_rate: 0.05
  tech_cap: 1000000.0
  tech_spawn_lo: 1.0
  tech_spawn_hi: 1.0
  kill_base: 0.55
  kill_tech_slope: 0.12
  res_min: 5.0
  res_max: 20.0
  res_total_budget: 150.0
  shield_cost_frac: 0.5
  softsign_a: 0.2
  softsign_reward_scale: 0.01
  res_reward_scale: 0.0
  attack_reward: 0.0
  p_deplete: 0.02
  deplete_lo: 0.5
  deplete_hi: 2.0
  gate_broadcast_tech: 1.0
  gate_broadcast_res: 10.0
  gate_observe_tech: 5.0
  gate_domain_tech: 5.0
  gate_strike_tech: 7.0
  develop_reward: 0.05
  death_penalty: 10.0
  bd_entry_penalty: 0.5
  bd_growth_mult: 0.2
  bd_explosion_mult: 0.1
  enable_black_domain: true
  spawn_schedule: [[0, 4]]

model:
  obs_dim: 38
  n_actions: 8
  hidden: [64, 64]

train:
  episodes: 1000
  gamma: 0.995
  lr: 0.0003
  batch_size: 128
  replay_size: 150000
  update_every: 2
  target_sync: 2000
  eps_start: 0.05
  eps_end: 0.05
  eps_frac: 0.2
  seeds: [42]

eval:
  episodes: 150
  epsilon: 0.05
  policy_seeds: [1001, 1002, 1003]
  env_seed_base: 10001
