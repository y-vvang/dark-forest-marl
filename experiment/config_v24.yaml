# DarkForestGrid v2.4 — observation-first information + equal starts + reward arms
# On top of v2.3-fix (strike-alive fix, conserved pool, softsign scale 0.01,
# target-pays shield, unbounded births, fixed-tick settlement).
# v2.4 changes (user spec 2026-10-09):
#   1) BROADCAST_SELF renamed BROADCAST_ALL (it always was an all-broadcast).
#   2) BROADCAST_OTHER restored: reveal a KNOWN target's coordinates to everyone
#      (sender NOT exposed) — the only remote "borrowed knife" channel after
#      tech-ranked strikes are gone; info-war tool of the malintent arm.
#   3) STRIKE_WEAK / STRIKE_STRONG removed (they ranked KNOWN civs by TRUE tech —
#      acting on tech never observed). OBSERVE now takes an explicit target
#      (nearest fallback). obs encoding already gates others' tech/res behind
#      observed[i,j]; the action set now honors the same principle.
#   4) No tech inheritance: tech_spawn_lo = tech_spawn_hi = 1.0 — all civs start
#      on the same line; stratification is earned, not born.
#   5) Reward arms (per-arm overrides on top of this file):
#      (a) classic       : as-is (softsign 0.01, bd_entry 0.5)
#      (b) terminal_only : softsign_reward_scale 0, bd_entry_penalty 0
#      (c) res_reward    : + res_reward_scale 0.0025 (0.0125..0.05/tick on
#                          DEVELOP — same order as the tech term, << death 10)
#      (d) malintent     : (c) + attack_reward 0.5 per strike-kill / invasion-
#                          kill / BROADCAST_OTHER reveal (= bd entry penalty;
#                          success-based: no reward for blocked strikes or
#                          self-exposing BROADCAST_ALL)

env:
  n_agents: 36
  world: 100.0
  detect_radius: 30.0
  t_max: 250
  p_detect_base: 0.03
  stealth_mult: 0.25
  p_detect_max: 0.35
  p_explosion: 0.01
  develop_rate: 0.05
  tech_cap: 1000000.0
  tech_spawn_lo: 1.0
  tech_spawn_hi: 1.0
  kill_base: 0.55
  kill_tech_slope: 0.12
  res_min: 5.0
  res_max: 20.0
  res_total_budget: 150.0
  shield_cost_frac: 0.5
  softsign_a: 0.2
  softsign_reward_scale: 0.01
  res_reward_scale: 0.0
  attack_reward: 0.0
  p_deplete: 0.02
  deplete_lo: 0.5
  deplete_hi: 2.0
  gate_broadcast_tech: 1.0
  gate_broadcast_res: 10.0
  gate_observe_tech: 5.0
  gate_domain_tech: 5.0
  gate_strike_tech: 7.0
  develop_reward: 0.05
  death_penalty: 10.0
  bd_entry_penalty: 0.5
  bd_growth_mult: 0.2
  bd_explosion_mult: 0.1
  enable_black_domain: true
  spawn_schedule: [[0, 4]]

model:
  obs_dim: 36
  n_actions: 8
  hidden: [64, 64]

train:
  episodes: 600
  gamma: 0.995
  lr: 0.0006
  batch_size: 128
  replay_size: 150000
  update_every: 2
  target_sync: 2000
  eps_start: 1.0
  eps_end: 0.05
  eps_frac: 0.5
  seeds: [42]

eval:
  episodes: 150
  epsilon: 0.05
  policy_seeds: [1001, 1002, 1003]
  env_seed_base: 10001
